name: 🐞 报告一个问题
description: 转换失败、装不上、exe 打不开……把现象写清楚，我照着修
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先谢谢你愿意花时间反馈。下面几项填得越具体，我越可能一次修好。

        > 安全提醒：**不要**把私人文件、账号密码、公司内网地址贴进来。

  - type: textarea
    id: what
    attributes:
      label: 你做了什么？
      description: 比如「在 DSH 里让它装 https://github.com/anthropics/skills 的 pdf」
      placeholder: 我运行了……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你以为会发生什么？
      placeholder: 我以为它会先预演，然后问我装不装
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
      description: 能贴报错原文最好（整段复制，别截图里的半句）
      render: text
      placeholder: 窗口里显示……
    validations:
      required: true

  - type: dropdown
    id: way
    attributes:
      label: 你是用哪种方式跑的？
      options:
        - 在 DSH 里说一句话（技能方式）
        - 双击 exe
        - 命令行 python
        - 命令行 exe
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 里的文件名，或 `--help` 显示的版本
      placeholder: DSH-Skill-Converter-v0.4.1.exe
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: Windows 11 23H2 / Windows 10 22H2
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: 有报告文件吗？
      description: 工具会生成 report.html（预演是 report-dry-run.html）。可以只贴结论条和「检查清单」里打红叉的那几行
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认一下
      options:
        - label: 我看过 README 的「常见错误对照」表
          required: true
        - label: 我贴的内容里没有隐私信息
          required: true
